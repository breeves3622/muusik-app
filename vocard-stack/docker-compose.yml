version: '3.8'

name: vocard

services:
  lavalink:
    container_name: vocard-lavalink
    image: ghcr.io/lavalink-devs/lavalink:latest
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx1G -Djava.net.preferIPv4Stack=true
      - SERVER_PORT=2333
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
      - ./lavalink/plugins:/opt/Lavalink/plugins
    networks:
      - vocard
    ports:
      - "2333:2333"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:2333/version || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  spotify-tokener:
    image: ghcr.io/topi314/spotify-tokener:master
    container_name: vocard-spotify-tokener
    restart: unless-stopped
    environment:
      - SPOTIFY_TOKENER_ADDR=0.0.0.0:49152
    networks:
      - vocard
    ports:
      - "49152:49152"

  vocard-db:
    container_name: vocard-db
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - ./data/mongo/db:/data/db
      - ./data/mongo/conf:/data/configdb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS:-adminpassword123}
    networks:
      - vocard
    command: ["mongod", "--oplogSize=1024", "--wiredTigerCacheSizeGB=1", "--auth"]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  vocard:
    container_name: vocard-bot
    image: ghcr.io/chocomeow/vocard:latest
    restart: unless-stopped
    volumes:
      - ./vocard/settings.json:/app/settings.json
    networks:
      - vocard
    depends_on:
      lavalink:
        condition: service_healthy
      vocard-db:
        condition: service_healthy

  vocard-dashboard:
    container_name: vocard-dashboard
    image: ghcr.io/chocomeow/vocard-dashboard:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./dashboard/settings.json:/app/settings.json
    networks:
      - vocard
    depends_on:
      - vocard

networks:
  vocard:
    name: vocard
